[project]
name = "messier"
version = "1.0.1"
description = "A corpus of agent evaluation records."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=4.0.0",
    "huggingface-hub>=1.0.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "boto3>=1.43.93",
    "eci",
    "harbor==0.23.0",
    "litellm>=1.50.0",
    "markdown-it-py>=4.2.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pyro-ppl>=1.9.1",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "remotezip>=0.12.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.10.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    "tqdm>=4.0.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/messier"]

[tool.uv.sources]
eci = { git = "https://github.com/epoch-research/eci-public.git", rev = "2bf2fd310002d4a1d790ae784ce7c6558b721034" }

[tool.uv]
default-groups = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
